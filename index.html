<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>FORGED has moved</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://forgedfight.com/">
<link rel="canonical" href="https://forgedfight.com/">
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});}).catch(function(){});
if (window.caches) caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});}).catch(function(){});
location.replace('https://forgedfight.com/');
</script>
</head><body><p>FORGED has moved to <a href="https://forgedfight.com/">forgedfight.com</a>.</p></body></html>
